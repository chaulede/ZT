<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Chinese Stroke Order Worksheet Generator | 汉字笔顺描红字帖生成器</title>
  <!-- 核心依赖库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #f0f3f8;
      margin: 0;
      padding: 24px;
      color: #333;
      min-height: 100vh;
    }
    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    .control-panel {
      background: #ffffff;
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* HSK 级别选择与双向词汇栏 */
    .hsk-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
      align-items: center;
    }
    .hsk-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #475569;
    }
    .hsk-item label {
      font-weight: 700;
      white-space: nowrap;
    }
    .hsk-item select {
      padding: 6px 10px;
      border: 1.2px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #ffffff;
      cursor: pointer;
      max-width: 100%;
    }
    .hsk-item select:focus {
      border-color: #2563eb;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }
    .input-field {
      flex: 1 1 150px;
    }
    .input-field.wide {
      flex: 2 1 200px;
    }
    .input-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
    }
    .input-field label span {
      font-weight: normal;
      color: #94a3b8;
    }
    .input-field input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .input-field input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn {
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 38px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-add { background: #2563eb; color: #fff; }
    .btn-add:hover { background: #1d4ed8; }
    .btn-download { background: #059669; color: #fff; }
    .btn-download:hover { background: #047857; }
    .btn-stroke-page { background: #7c3aed; color: #fff; }
    .btn-stroke-page:hover { background: #6d28d9; }
    .btn-trad-add { 
      background: linear-gradient(135deg, #d97706, #b45309); 
      color: #fff; 
    }
    .btn-trad-add:hover { background: linear-gradient(135deg, #b45309, #92400e); }

    .status-hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
    }

    /* 字帖展示区 */
    .worksheet {
      background: #ffffff;
      padding: 36px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      min-height: 500px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: #94a3b8;
    }
    .word-block {
      position: relative;
      margin-bottom: 28px;
    }
    .btn-delete {
      position: absolute;
      top: 0;
      right: 0;
      background: #fee2e2;
      color: #ef4444;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-delete:hover { background: #ef4444; color: #fff; }

    .word-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 8px;
      padding-right: 80px;
    }
    .word-chinese {
      font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "楷体", serif;
      font-size: 26px;
      font-weight: bold;
      color: #0f172a;
      letter-spacing: 2px;
    }
    .word-pinyin {
      color: #e11d48 !important;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .word-meaning {
      color: #475569;
      font-size: 16px;
    }
    .trad-tag {
      font-size: 12px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* 笔顺分解区 */
    .stroke-rows {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stroke-sequence-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      min-height: 28px;
    }
    .stroke-svg-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stroke-svg-item svg { overflow: visible; }

    .anim-play-btn {
      margin-left: 8px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 米字格网格结构：15列全宽自适应，字放大 */
    .grid-container {
      border: 1.2px solid #475569;
      margin-bottom: 6px;
      background-color: #ffffff;
    }
    .grid-row {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      border-bottom: 1.2px solid #475569;
    }
    .grid-row:last-child {
      border-bottom: none;
    }
    .mi-grid {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-right: 1.2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }
    .mi-grid:last-child {
      border-right: none;
    }
    .grid-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .grid-svg line {
      stroke: #cbd5e1 !important;
      stroke-width: 1;
      stroke-dasharray: 2 2;
    }
    .grid-char {
      position: relative;
      font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "楷体", serif;
      font-size: 38px;
      line-height: 1;
      user-select: none;
      z-index: 2;
    }
    .char-black { color: #0f172a !important; }
    .char-trace { color: #cbd5e1 !important; }
    .char-trace-red { color: #f87171 !important; }

    /* 中央大屏动画演示模态框 */
    .big-anim-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .big-anim-card {
      background: #ffffff;
      padding: 28px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      position: relative;
    }
    .big-anim-close {
      position: absolute;
      top: 14px; right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      color: #94a3b8;
      cursor: pointer;
    }
    .big-anim-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 16px;
    }
    .big-anim-stage-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 18px;
      background: #ffffff;
      border: 2px solid #475569;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .big-anim-stage-wrapper .grid-svg line {
      stroke: #cbd5e1 !important;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }
    .big-anim-ctrl-btn {
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    /* 笔画练习表格 */
    .stroke-practice-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #7c3aed;
    }
    .stroke-practice-title {
      font-size: 24px;
      font-weight: bold;
      color: #1e293b;
    }
    .stroke-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #e2e8f0;
    }
    .stroke-info-card {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 240px;
      flex-shrink: 0;
    }
    .stroke-badge-id {
      background: #7c3aed;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .stroke-grid-wrapper { flex-grow: 1; }
    .stroke-grid-row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      border: 1.2px solid #475569;
    }

    /* 打印配置 */
    @media print {
      body { background: #fff !important; padding: 0 !important; }
      .control-panel, .btn-delete, .anim-play-btn, .big-anim-modal { display: none !important; }
      .worksheet { box-shadow: none !important; padding: 0 !important; max-width: 100% !important; }
      .word-block, .stroke-item-row { page-break-inside: avoid; }
      @page { size: A4 portrait; margin: 12mm 10mm; }
    }
  </style>
</head>
<body>

  <!-- 1. 中央大屏动画演示模态框 -->
  <div class="big-anim-modal" id="bigAnimModal" onclick="if(event.target===this) closeBigAnimation()">
    <div class="big-anim-card">
      <button class="big-anim-close" onclick="closeBigAnimation()">✕</button>
      <div class="big-anim-title" id="animModalTitle">笔画顺序演示 / Stroke Order Animation</div>
      <div class="big-anim-stage-wrapper">
        <svg class="grid-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="0" y1="0" x2="100" y2="100"></line>
          <line x1="100" y1="0" x2="0" y2="100"></line>
          <line x1="0" y1="50" x2="100" y2="50"></line>
          <line x1="50" y1="0" x2="50" y2="100"></line>
        </svg>
        <div id="bigAnimTarget"></div>
      </div>
      <button class="big-anim-ctrl-btn" id="animReplayBtn" onclick="replayBigAnimation()">🔄 重播 / Replay</button>
    </div>
  </div>

  <!-- 2. 字帖主应用容器 -->
  <div class="container">
    <div class="control-panel">
      <div class="panel-title">
        <span id="mainTitle">✍️ 汉字笔顺描红字帖生成器 | Hanzi Worksheet Generator</span>
        <button class="btn" style="background: #475569; color: #fff; height: 32px; font-size: 12px;" onclick="toggleLanguage()">🌐 中文 / English</button>
      </div>

      <!-- HSK 级别选择与双向词汇栏 -->
      <div class="hsk-toolbar">
        <div class="hsk-item">
          <label id="lblHsk">📚 HSK Level / 等级:</label>
          <select id="hskLevelSelect" onchange="onHskLevelChange()">
            <option value="1" selected>HSK 1</option>
            <option value="2">HSK 2</option>
            <option value="3">HSK 3</option>
            <option value="4-1">HSK 4-1</option>
          </select>
        </div>
        <div class="hsk-item" style="flex: 1 1 300px;">
          <label id="lblSelectWord">🔍 Select Word / 快速选词:</label>
          <select id="hskWordSelect" style="width: 100%; max-width: 480px;" onchange="onHskWordSelect(this.value)">
            <option value="">-- Choose from HSK list --</option>
          </select>
        </div>
        <div class="hsk-item">
          <label id="lblMode">👶 模式 / Mode:</label>
          <select id="kidsModeSelect" onchange="renderAllWords()">
            <option value="standard">标准模式 (Standard)</option>
            <option value="kids" selected>少儿描红 (Kids Trace)</option>
          </select>
        </div>
      </div>
      
      <div class="input-group">
        <div class="input-field">
          <label id="lblHanzi">汉字 / Chinese <span>(独立手动输入)</span></label>
          <input type="text" id="inputWord" placeholder="e.g. 中国 or 水" value="中国" oninput="onChineseInput()">
        </div>
        <div class="input-field">
          <label id="lblPinyin">拼音 / Pinyin <span>(自动/手动输入)</span></label>
          <input type="text" id="inputPinyin" placeholder="e.g. zhōng guó" value="zhōng guó" oninput="onPinyinInput()">
        </div>
        <div class="input-field wide">
          <label id="lblEnglish">英文 / English <span>(独立手动输入)</span></label>
          <input type="text" id="inputMeaning" placeholder="e.g. China, water, hello..." value="China">
        </div>
        <button class="btn btn-add" id="btnAddSimp" onclick="handleAddWord(false)">➕ 添加简体 / Simplified</button>
        <button class="btn btn-trad-add" id="btnAddTrad" onclick="handleAddWord(true)" title="Convert to Traditional characters">🀄 生成繁体 / Traditional</button>
        <button class="btn btn-download" id="btnDownload" onclick="window.print()">📥 下载 PDF / Print</button>
        <button class="btn btn-stroke-page" id="btnStrokePage" onclick="renderStrokePracticeSheet()">📋 32 笔画练习 / 32 Strokes</button>
      </div>

      <div class="status-hint" id="statusHint">
        <span>💡 <b>Tip</b>: 汉字和英文框完全支持手动自由输入；拼音框支持输入汉字后自动填充，也允许随时手动修改。</span>
      </div>
    </div>

    <div class="worksheet" id="worksheet"></div>
  </div>

  <script>
    let bigWriterInstance = null;
    let s2tConverter = window.OpenCC ? OpenCC.Converter({ from: 'cn', to: 'tw' }) : null;
    let currentLang = 'zh'; 
    let isUserTypingPinyin = false; 

    const I18N = {
      zh: {
        pageTitle: "Chinese Stroke Order Worksheet Generator | 汉字笔顺描红字帖生成器",
        mainTitle: "✍️ 汉字笔顺描红字帖生成器 | Hanzi Worksheet Generator",
        lblHsk: "📚 HSK Level / 等级:",
        lblSelectWord: "🔍 Select Word / 快速选词:",
        lblMode: "👶 模式 / Mode:",
        lblHanzi: "汉字 / Chinese <span>(独立手动输入)</span>",
        lblPinyin: "拼音 / Pinyin <span>(自动/手动输入)</span>",
        lblEnglish: "英文 / English <span>(独立手动输入)</span>",
        btnAddSimp: "➕ 添加简体 / Simplified",
        btnAddTrad: "🀄 生成繁体 / Traditional",
        btnDownload: "📥 下载 PDF / Print",
        btnStrokePage: "📋 32 笔画练习 / 32 Strokes",
        statusHint: "💡 <b>Tip</b>: 汉字和英文框完全支持手动自由输入；拼音框支持输入汉字后自动填充，也允许随时手动修改。",
        emptyState: "字帖中暂无词条，请在上方添加。",
        deleteBtn: "✕ 删除",
        strokeLabel: "笔顺:",
        animBtn: "▶ 动态演示",
        animTitle: "笔画顺序演示 / Stroke Order Animation",
        replayBtn: "🔄 重播 / Replay",
        strokePracticeTitle: "32 Standard Chinese Strokes Practice | 常用汉字笔画名称与描红练习表"
      },
      en: {
        pageTitle: "Chinese Stroke Order Worksheet Generator",
        mainTitle: "✍️ Chinese Stroke Order Worksheet Generator",
        lblHsk: "📚 HSK Level:",
        lblSelectWord: "🔍 Select Word:",
        lblMode: "👶 Mode:",
        lblHanzi: "Chinese <span>(Independent input)</span>",
        lblPinyin: "Pinyin <span>(Auto/Manual)</span>",
        lblEnglish: "English <span>(Independent input)</span>",
        btnAddSimp: "➕ Add Simplified",
        btnAddTrad: "🀄 Add Traditional",
        btnDownload: "📥 Print / PDF",
        btnStrokePage: "📋 32 Strokes Practice",
        statusHint: "💡 <b>Tip</b>: Chinese and English fields are fully independent. Pinyin auto-fills on typing Chinese, but can be manually edited.",
        emptyState: "Worksheet is empty. Type a word or choose from HSK list above.",
        deleteBtn: "✕ Delete",
        strokeLabel: "Strokes:",
        animBtn: "▶ Animate",
        animTitle: "Stroke Order Animation",
        replayBtn: "🔄 Replay",
        strokePracticeTitle: "32 Standard Chinese Strokes Practice"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      updateUIStrings();
      renderAllWords();
    }

    function updateUIStrings() {
      const t = I18N[currentLang];
      document.getElementById('pageTitle').innerText = t.pageTitle;
      document.getElementById('mainTitle').innerHTML = t.mainTitle;
      document.getElementById('lblHsk').innerHTML = t.lblHsk;
      document.getElementById('lblSelectWord').innerHTML = t.lblSelectWord;
      document.getElementById('lblMode').innerHTML = t.lblMode;
      document.getElementById('lblHanzi').innerHTML = t.lblHanzi;
      document.getElementById('lblPinyin').innerHTML = t.lblPinyin;
      document.getElementById('lblEnglish').innerHTML = t.lblEnglish;
      document.getElementById('btnAddSimp').innerHTML = t.btnAddSimp;
      document.getElementById('btnAddTrad').innerHTML = t.btnAddTrad;
      document.getElementById('btnDownload').innerHTML = t.btnDownload;
      document.getElementById('btnStrokePage').innerHTML = t.btnStrokePage;
      document.getElementById('statusHint').innerHTML = t.statusHint;
      document.getElementById('animModalTitle').innerText = t.animTitle;
      document.getElementById('animReplayBtn').innerText = t.replayBtn;
    }

    // 内置官方分类词汇表 (基于 HSK1.txt, HSK2.txt, HSK3.txt, HSK4-1.txt)[cite: 4, 5, 6, 7]

        { zh: "工作", py: "gōngzuò", en: "job / work" },

    // --- HSK 词库选择逻辑 ---
    function populateHskWordSelect(level) {
      const select = document.getElementById("hskWordSelect");
      select.innerHTML = '<option value="">-- Choose from HSK list / 从列表选词 --</option>';
      const list = HSK_DICTIONARY[level] || [];
      list.forEach(item => {
        const opt = document.createElement("option");
        opt.value = JSON.stringify(item);
        opt.innerText = `${item.zh} (${item.py}) - ${item.en}`;
        select.appendChild(opt);
      });
    }

    function onHskLevelChange() {
      const level = document.getElementById("hskLevelSelect").value;
      populateHskWordSelect(level);
    }

    function onHskWordSelect(valueStr) {
      if (!valueStr) return;
      try {
        const item = JSON.parse(valueStr);
        document.getElementById("inputWord").value = item.zh;
        document.getElementById("inputPinyin").value = item.py;
        document.getElementById("inputMeaning").value = item.en;
        isUserTypingPinyin = true; 
      } catch (e) {}
    }

    // --- 独立手动输入控制（拼音支持自动填充与手动修改，中文与英文完全独立） ---
    function onPinyinInput() {
      isUserTypingPinyin = true; 
    }

    function onChineseInput() {
      const text = document.getElementById('inputWord').value.trim();
      if (!text) {
        document.getElementById('inputPinyin').value = '';
        isUserTypingPinyin = false;
        return;
      }

      if (window.pinyinPro && !isUserTypingPinyin) {
        try {
          document.getElementById('inputPinyin').value = window.pinyinPro.pinyin(text, { toneType: 'symbol', type: 'string' });
        } catch (e) {}
      }
    }

    function onEnglishInput() {
      // 英文输入框保持独立手动输入，不进行自动反查
    }

    // --- 字帖添加与渲染 ---
    function handleAddWord(asTraditional = false) {
      let word = document.getElementById('inputWord').value.trim();
      let pinyin = document.getElementById('inputPinyin').value.trim();
      let meaning = document.getElementById('inputMeaning').value.trim();
      if (!word) {
        alert("Please enter Chinese characters! / 请输入汉字！");
        return;
      }

      if (asTraditional && s2tConverter) {
        word = s2tConverter(word);
        if (window.pinyinPro && !isUserTypingPinyin) {
          pinyin = window.pinyinPro.pinyin(word, { toneType: 'symbol', type: 'string' });
        }
      }

      wordList.push({ id: Date.now(), word, pinyin, meaning, isTraditional: asTraditional });
      renderAllWords();

      document.getElementById('inputWord').value = '';
      document.getElementById('inputPinyin').value = '';
      document.getElementById('inputMeaning').value = '';
      isUserTypingPinyin = false;
      document.getElementById('inputWord').focus();
    }

    function deleteWord(id) {
      wordList = wordList.filter(item => item.id !== id);
      renderAllWords();
    }

    function renderAllWords() {
      const worksheet = document.getElementById('worksheet');
      worksheet.innerHTML = '';

      if (wordList.length === 0) {
        worksheet.innerHTML = `<div class="empty-state"><p style="font-size: 36px;">📝</p><p>${I18N[currentLang].emptyState}</p></div>`;
        return;
      }

      wordList.forEach(item => renderSingleWordBlock(item, worksheet));
    }

    function renderSingleWordBlock(item, container) {
      const block = document.createElement('div');
      block.className = 'word-block';
      block.id = `word-${item.id}`;

      let tradBadge = item.isTraditional ? '<span class="trad-tag">繁體 Traditional</span>' : '';

      let headerHTML = `
        <button class="btn-delete" onclick="deleteWord(${item.id})" title="Delete / 删除">${I18N[currentLang].deleteBtn}</button>
        <div class="word-header">
          <span class="word-chinese">${item.word}</span>
          ${tradBadge}
          <span class="word-pinyin">${item.pinyin}</span>
          <span class="word-meaning">${item.meaning}</span>
        </div>
      `;

      const strokeContainer = document.createElement('div');
      strokeContainer.className = 'stroke-rows';

      const chars = item.word.split('').filter(c => /[\u4e00-\u9fa5]/.test(c));
      const activeChars = chars.length > 0 ? chars : item.word.split('');

      const isKidsMode = document.getElementById('kidsModeSelect').value === 'kids';
      const totalCols = 15;

      let gridHTML = '';

      activeChars.forEach(char => {
        gridHTML += `<div class="grid-container"><div class="grid-row" style="grid-template-columns: repeat(${totalCols}, 1fr);">`;
        for (let i = 0; i < totalCols; i++) {
          let content = '';
          if (isKidsMode) {
            if (i < 12) {
              let charClass = (i === 0) ? "char-black" : "char-trace-red";
              content = `<span class="grid-char ${charClass}">${char}</span>`;
            }
          } else {
            if (i === 0) {
              content = `<span class="grid-char char-black">${char}</span>`;
            } else if (i >= 1 && i <= 4) {
              content = `<span class="grid-char char-trace">${char}</span>`;
            }
          }
          gridHTML += createGridCell(content);
        }
        gridHTML += `</div></div>`;
      });

      block.innerHTML = headerHTML;
      block.appendChild(strokeContainer);
      block.insertAdjacentHTML('beforeend', gridHTML);
      container.appendChild(block);

      for (let index = 0; index < activeChars.length; index++) {
        renderStrokeSequenceWithCenterDemo(activeChars[index], strokeContainer);
      }
    }

    function createGridCell(content) {
      return `
        <div class="mi-grid">
          <svg class="grid-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line x1="0" y1="0" x2="100" y2="100"></line>
            <line x1="100" y1="0" x2="0" y2="100"></line>
            <line x1="0" y1="50" x2="100" y2="50"></line>
            <line x1="50" y1="0" x2="50" y2="100"></line>
          </svg>
          ${content}
        </div>
      `;
    }

      STROKE_DATA_LIST.forEach(item => {
        let gridCellsHTML = '';
        for (let i = 0; i < 12; i++) {
          let content = (i === 0) ? `<span class="grid-char char-black">${item.char}</span>` : `<span class="grid-char char-trace">${item.char}</span>`;

        }
        tableHTML += `
          <div class="stroke-item-row">
            <div class="stroke-info-card">
              <span class="stroke-badge-id">${item.id}</span>
              <span><b>${item.name}</b> (${item.en}) <br><small style="color:#64748b;">Example: ${item.example}</small></span>
            </div>
            <div class="stroke-grid-wrapper"><div class="stroke-grid-row">${gridCellsHTML}</div></div>
          </div>
        `;
      });
      tableHTML += '</div>';
      worksheet.innerHTML = headerHTML + tableHTML;
    }

    async function loadCharStrokesData(char) {
      const encoded = encodeURIComponent(char);
      const urls = [
        `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${encoded}.json`,
        `https://unpkg.com/hanzi-writer-data@2.0/${encoded}.json`
      ];
      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data && data.strokes) return data.strokes;
          }
        } catch (e) {}
      }
      return null;
    }

    function openBigAnimation(char) {
      const modal = document.getElementById('bigAnimModal');
      document.getElementById('animModalTitle').innerText = `【${char}】${I18N[currentLang].animTitle}`;
      document.getElementById('bigAnimTarget').innerHTML = '';
      modal.style.display = 'flex';

      if (window.HanziWriter) {
        bigWriterInstance = HanziWriter.create('bigAnimTarget', char, {
          width: 230, height: 230, padding: 10, strokeColor: '#e11d48', outlineColor: '#cbd5e1', showOutline: true
        });
        bigWriterInstance.animateCharacter();
      }
    }

    function replayBigAnimation() {
      if (bigWriterInstance) bigWriterInstance.animateCharacter();
    }

    function closeBigAnimation() {
      document.getElementById('bigAnimModal').style.display = 'none';
      document.getElementById('bigAnimTarget').innerHTML = '';
      bigWriterInstance = null;
    }

    async function renderStrokeSequenceWithCenterDemo(char, container) {
      const row = document.createElement('div');
      const seqLabel = document.createElement('span');
      seqLabel.style.fontSize = '12px';
      seqLabel.style.color = '#64748b';
      seqLabel.style.fontWeight = '600';
      seqLabel.style.marginRight = '4px';
      seqLabel.innerText = `【${char}】${I18N[currentLang].strokeLabel}`;
      row.appendChild(seqLabel);
      row.className = 'stroke-sequence-row';
      container.appendChild(row);

      const strokes = await loadCharStrokesData(char);
      if (strokes && strokes.length > 0) {
        for (let i = 0; i < strokes.length; i++) {
          const itemBox = document.createElement('div');
          itemBox.className = 'stroke-svg-item';
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 1024 1024');
          svg.setAttribute('width', '20');
          svg.setAttribute('height', '20');
          const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          group.setAttribute('transform', 'scale(1, -1) translate(0, -900)');

          for (let s = 0; s <= i; s++) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', strokes[s]);
            path.setAttribute('fill', (s === i) ? '#e11d48' : '#1e293b');
            group.appendChild(path);
          }
          svg.appendChild(group);
          itemBox.appendChild(svg);
          row.appendChild(itemBox);
        }

        const animBtn = document.createElement('button');
        animBtn.className = 'anim-play-btn';
        animBtn.innerHTML = I18N[currentLang].animBtn;
        animBtn.onclick = () => openBigAnimation(char);
        row.appendChild(animBtn);
      }
    }
  </script>
</body>
